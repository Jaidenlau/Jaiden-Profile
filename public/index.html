<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>%PAGE_TITLE%</title>
  <meta name="description" content="%DESCRIPTION%">
  <link rel="canonical" href="%ORIGIN%%PATH%">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jaiden Lau">
  <meta property="og:title" content="%PAGE_TITLE%">
  <meta property="og:description" content="%DESCRIPTION%">
  <meta property="og:url" content="%ORIGIN%%PATH%">
  <meta property="og:image" content="%ORIGIN%/images/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=%VERSION%">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>
  <div class="radio-slot" id="radio"></div>

  <main id="main">
    <!-- Home: the video, then the projects list -->
    <div id="view-home">
      <section class="hero wrap" id="hero"></section>

      <section class="wrap work" id="work" aria-labelledby="work-title">
        <div class="work-side">
          <h2 id="work-title" class="section-title">Selected work</h2>
          <p class="section-note" id="work-note"></p>
          <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
        </div>
        <ol class="proj-list" id="projects"></ol>
      </section>
    </div>

    <!-- A big project's own page (/projects/<id>), shown in place so music keeps playing -->
    <div id="view-project" class="wrap pp" hidden></div>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <noscript><p class="wrap noscript">This page needs JavaScript to show the projects.</p></noscript>
  <script src="/js/content.js?v=%VERSION%"></script>
  <script src="/js/app.js?v=%VERSION%"></script>
</body>
</html>
